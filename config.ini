# Faceless Viral Engine — user config
# Edit these. Everything else is automated.

[engine]
niche = history             # history | curiosity | money | reddit | tech
                           # (Wedge = History/Documentary per office-hours + market-pm)
videos_per_run = 1           # how many to produce per scheduled run
publish_dir = publish        # where finished videos land (YOU publish from here)

[revenue]
# The ONE line that turns views into money (F4). Put YOUR real offer link here —
# an affiliate URL, your own product/Gumroad page, a newsletter, a Ko-fi, etc.
# It is appended to every video's description.txt so YOU paste it when publishing.
# LEAVE BLANK to emit nothing (no broken/placeholder link ever ships).
offer_url =
# Call-to-action text shown before the link. Keep it short + on-brand.
offer_cta = More history most people never learned:

[script]
# Local LLM for free script generation (no API cost).
# provider = template  -> zero-cost, offline, always works (recommended default)
# provider = ollama    -> needs `ollama run gemma4` to work (unstable on some GPUs)
provider = template
ollama_model = gemma4
# Fallback provider if Ollama is down: "template" (zero-cost, no LLM)
fallback = template

[voice]
# provider = kokoro      -> BEST FREE, realistic, runs locally (no API, no money). DEFAULT.
# provider = edge-tts    -> free, decent, needs internet.
# provider = elevenlabs  -> most realistic (paid API). Needs eleven_api_key + eleven_voice_id.
provider = kokoro
# Kokoro voice presets (all free, local): af_heart, af_bella, am_michael, bm_george, ...
kokoro_voice = af_heart
# edge-tts voice (used if provider=edge-tts)
voice = en-US-AndrewNeural
# ElevenLabs (realistic, paid). Get key at elevenlabs.io, voice id from Voice Lab.
eleven_api_key =
eleven_voice_id =

[visuals]
# Pexels free API key -> REAL moving stock footage per beat (captivating, realistic).
# Get one free in 2 min: https://www.pexels.com/api/  (no key = animated gradient fallback)
pexels_api_key =
# How long each visual beat shows (seconds). The edit cuts per beat.
beat_seconds = 4

[music]
# Royalty-free background music. Leave empty for no music (safest for monetization).
# If set, must be a local file you have rights to. This bed is ORIGINAL
# (synthesized by assets/make_music_bed.py) -> safe for monetization.
bg_music = assets/music/bed_ambient.wav

[output]
width = 1080
height = 1920
fps = 30

# ---------------------------------------------------------------------------
# [quality] — upgraded engine (engine_pro.py). Additive; engine.py ignores it.
# Tune the 2026 restraint playbook here. Flip cut_rate / sfx to A/B.
# ---------------------------------------------------------------------------
[quality]
# Voice: resilience chain per PLAN Wave 1 / Decision #6 =
#   Chatterbox (GPU) -> Kokoro -> edge-tts -> silent pad.
# Chatterbox is the plan's PRIMARY and RENDERS ON GPU via the isolated venv on
#   D:\venv_voice (torch 2.6+cu124, 2.5GB wheel + 2.1GB model live on D:).
# voice_engine=chatterbox -> engine_pro uses the D: venv and checks CUDA *inside*
#   the venv; if CUDA is unavailable it drops to Kokoro, then edge-tts, then silent.
# (Earlier note claiming Chatterbox "cannot run on this box" is STALE — fixed.)
voice_engine = chatterbox
# Edit pace: 2.5-4s restrained cuts (premium, not AI-slop). cut_rate = beats/min hint.
cut_rate = 2.8
# SFX density: "minimal" = one reveal whoosh + number ticks only (no per-cut whoosh).
sfx_density = minimal
# Variation seed: leave 0 for auto-random per run; set int for reproducible tests.
variation_seed = 0

